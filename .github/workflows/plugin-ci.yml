name: Plugin CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skill-contract:
    name: Skill contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Agent Skills reference validator
        run: python -m pip install 'skills-ref==0.1.1'
      - name: Validate every Skill against Agent Skills format
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' skills < <(find skills -mindepth 2 -maxdepth 2 -name SKILL.md -print0)
          if (( ${#skills[@]} == 0 )); then
            echo "::error::No Skill entrypoint exists"
            exit 1
          fi
          for skill in "${skills[@]}"; do
            skills-ref validate "$(dirname "$skill")"
          done
      - name: Validate local links and goal/use-case routing
        run: python scripts/verify_repository.py

  workflow-lint:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install official actionlint release
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check all workflow files and expressions
        run: '"$(go env GOPATH)/bin/actionlint" -color'

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security audit with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: '1.29.0'
          advanced-security: false
          annotations: true
          inputs: .github/workflows
          min-severity: medium
          min-confidence: medium

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout history for secret audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks audit
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  skill-artifact:
    name: Skill source artifact
    needs: [skill-contract, workflow-lint, workflow-security, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build verifiable Skill source bundle (not a Plugin release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/ci-cd-quality-engineering.tar.gz -C skills ci-cd-quality-engineering
          tar -tzf dist/ci-cd-quality-engineering.tar.gz > dist/CONTENTS
          grep -qx 'ci-cd-quality-engineering/SKILL.md' dist/CONTENTS
          grep -q '^ci-cd-quality-engineering/references/' dist/CONTENTS
          (cd dist && sha256sum ci-cd-quality-engineering.tar.gz > SHA256SUMS)
      - name: Upload bundle and digest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ci-cd-quality-engineering-source-${{ github.sha }}
          path: |
            dist/ci-cd-quality-engineering.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: [skill-contract, workflow-lint, workflow-security, secret-scan, skill-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reject all failed, skipped or cancelled mandatory work
        shell: bash
        env:
          SKILL: ${{ needs.skill-contract.result }}
          SYNTAX: ${{ needs.workflow-lint.result }}
          SECURITY: ${{ needs.workflow-security.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          ARTIFACT: ${{ needs.skill-artifact.result }}
        run: |
          set -euo pipefail
          for key in SKILL SYNTAX SECURITY SECRETS ARTIFACT; do
            result="${!key}"
            echo "$key => $result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$key did not succeed ($result)"
              exit 1
            fi
          done
